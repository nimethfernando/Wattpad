  <path d="M26 84 C38 78 52 79 64 85 C76 79 90 78 102 84 L102 91 C90 85 76 86 64 92 C52 86 38 85 26 91 Z" fill="url(#avora-accent)" opacity="0.95" />
  
  <path d="M26 76 C40 70 52 71 64 77 C76 71 88 70 102 76 L100 81 C88 76 76 77 64 82 C52 77 40 76 28 81 Z" fill="url(#avora-flame)" />

  <path d="M28 67 C42 62 52 63 64 69 C76 63 86 62 100 67 L98 71 C86 67 76 68 64 73 C52 68 42 67 30 71 Z" fill="#fef08a" opacity="0.9" />

