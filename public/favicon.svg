  <circle cx="64" cy="69" r="2.5" fill="#fef08a" />
  <line x1="64" y1="71" x2="64" y2="87" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

  <!-- Phoenix Flame Quill Feather (Icon Crest) -->
  <path d="M64 20 C64 20 74 30 75 42 C75 48 72 53 69 56 C74 50 78 44 76 34 C82 42 81 53 74 61 C85 52 84 39 79 28 C87 36 86 52 76 65 C81 60 84 52 84 46 C87 55 81 67 70 73 L64 62 L58 73 C47 67 41 55 44 46 C44 52 47 60 52 65 C42 52 41 36 49 28 C44 39 43 52 54 61 C47 53 46 42 52 34 C50 44 54 50 59 56 C56 53 53 48 53 42 C54 30 64 20 64 20 Z" fill="url(#avora-flame)" filter="url(#glow)" />
</svg>
